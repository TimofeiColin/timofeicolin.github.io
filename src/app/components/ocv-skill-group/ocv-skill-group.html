<mat-expansion-panel [expanded]="group().expanded ?? false">
  <mat-expansion-panel-header>
    <mat-panel-title>{{ group().name }}</mat-panel-title>
  </mat-expansion-panel-header>

  <mat-chip-set role="list" [attr.aria-label]="group().name">
    @for (skill of group().skills; track skill) {
      <mat-chip role="listitem">{{ skill }}</mat-chip>
    }
  </mat-chip-set>
</mat-expansion-panel>
