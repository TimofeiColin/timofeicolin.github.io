<mat-expansion-panel [expanded]="job().expanded ?? false">
  <mat-expansion-panel-header>
    <mat-panel-title>
      <span
        ><strong>{{ job().company }},</strong>&nbsp;<em>{{ job().role }}</em></span
      >
    </mat-panel-title>
    <mat-panel-description class="dates">
      {{ job().startDate }} – {{ job().endDate }}
    </mat-panel-description>
  </mat-expansion-panel-header>

  @for (project of job().projects; track $index) {
    <ocv-project [project]="project" />
  }
</mat-expansion-panel>
